version: "1.0"

modules:
  - name: "FIRRTLReg"
    type: "chisel"
    path: "chisel/reg"
    description: "Parametric register with configurable width"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        required: false
      - name: "init"
        type: "integer"
        default: 0
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "read"
        ready: false
        enable: true
        outputs: ["data: !firrtl.uint<${width}>"]
      - name: "write"
        ready: true
        enable: false
        inputs: ["data: !firrtl.uint<${width}>"]
    conflict_matrix:
      - [read, write, "SequentialBefore"]
    build:
      command: "./build.sh"
      args: ["width=${width}", "init=${init}"]
      output_pattern: "Reg_width${width}_init${init}.mlir"
      cache: true

  - name: "Mem1r1w1c"
    type: "chisel"
    path: "firrtl/mem1r1w1c"
    description: "1R1W synchronous memory (read and write latency = 1)"
    parameters:
      - name: "data_width"
        type: "integer"
        default: 32
        required: false
      - name: "addr_width"
        type: "integer"
        default: 10
        required: false
      - name: "depth"
        type: "integer"
        default: 1024
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "rd0"
        ready: false
        enable: true
        inputs: ["raddr: !firrtl.uint<${addr_width}>"]
      - name: "rd1"
        ready: true
        enable: false
        outputs: ["rdata: !firrtl.uint<${data_width}>"]
      - name: "write"
        ready: false
        enable: true
        inputs: ["wdata: !firrtl.uint<${data_width}>", "waddr: !firrtl.uint<${addr_width}>"]
    conflict_matrix:
      - [write, write, "Conflict"]
      - [rd0, rd0, "Conflict"]
    build:
      command: "./build.sh"
      args: ["data_width=${data_width}", "addr_width=${addr_width}", "depth=${depth}"]
      output_pattern: "Mem1r1w1c_w${data_width}_a${addr_width}_d${depth}.mlir"
      cache: true

  - name: "Mem1r1w0c"
    type: "chisel"
    path: "firrtl/mem1r1w0c"
    description: "1R1W asynchronous memory (write latency = 1, read latency = 0)"
    parameters:
      - name: "data_width"
        type: "integer"
        default: 32
        required: false
      - name: "addr_width"
        type: "integer"
        default: 10
        required: false
      - name: "depth"
        type: "integer"
        default: 1024
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "read"
        ready: false
        enable: true
        inputs: ["raddr: !firrtl.uint<${addr_width}>", "rdata: !firrtl.uint<${data_width}>"]
      - name: "write"
        ready: false
        enable: true
        inputs: ["wdata: !firrtl.uint<${data_width}>", "waddr: !firrtl.uint<${addr_width}>"]
    conflict_matrix:
      - [write, write, "Conflict"]
      - [read, read, "Conflict"]
    build:
      command: "./build.sh"
      args: ["data_width=${data_width}", "addr_width=${addr_width}", "depth=${depth}"]
      output_pattern: "Mem1r1w0c_w${data_width}_a${addr_width}_d${depth}.mlir"
      cache: true

  - name: "Wire"
    type: "firrtl"
    path: "firrtl/wire"
    description: "Combinational wire with write enable"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        required: false
    methods:
      - name: "write"
        ready: false
        enable: true
        inputs: ["write_data: !firrtl.uint<${width}>"]
    values:
      - name: "read"
        ready: false
        enable: false
        outputs: ["read_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["width=${width}"]
      output_pattern: "Wire_w${width}.mlir"
      cache: true

  # ============================================================================
  # FloPoCo-based Floating Point IP Modules (Fully Pipelined, II=1)
  # ============================================================================

  - name: "FloatAdd"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point addition using FloPoCo IEEEFMA (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 5
        values: [2, 3, 4, 5, 7]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>", "operand1: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=add", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatAdd_w${width}_l${latency}.mlir"
      cache: true

  - name: "FloatSub"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point subtraction using FloPoCo IEEEFMA (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 5
        values: [2, 3, 4, 5, 7]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>", "operand1: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=sub", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatSub_w${width}_l${latency}.mlir"
      cache: true

  - name: "FloatMul"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point multiplication using FloPoCo IEEEFMA (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 5
        values: [2, 3, 4, 5, 7]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>", "operand1: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=mul", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatMul_w${width}_l${latency}.mlir"
      cache: true

  - name: "FloatDiv"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point division using FloPoCo (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 13
        values: [3, 5, 6, 8, 9, 13]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>", "operand1: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=div", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatDiv_w${width}_l${latency}.mlir"
      cache: true

  - name: "FloatSqrt"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point square root using FloPoCo (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 13
        values: [3, 5, 6, 8, 10, 13]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=sqrt", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatSqrt_w${width}_l${latency}.mlir"
      cache: true

  - name: "FloatExp"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point exponential (e^x) using FloPoCo IEEEExp (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 5
        values: [4, 5, 6, 7, 8, 10]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=exp", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatExp_w${width}_l${latency}.mlir"
      cache: true

  - name: "FloatLog"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point natural logarithm (ln) using FloPoCo FPLog (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 5
        values: [3, 4, 5, 6, 7, 10]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=log", "width=${width}", "latency=${latency}"]
      output_pattern: "FloatLog_w${width}_l${latency}.mlir"
      cache: true

  # ============================================================================
  # FloPoCo-based Floating Point Comparison
  # ============================================================================

  - name: "FloatCmp"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point comparison using FloPoCo IEEEComp (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "predicate"
        type: "integer"
        default: 0
        values: [0, 1, 2, 3, 4, 5, 6, 7]
        required: false
        description: "0=eq, 1=lt, 2=le, 3=gt, 4=ge, 5=ne, 6=ord, 7=uno"
      - name: "latency"
        type: "integer"
        default: 2
        values: [1, 2, 3]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>", "operand1: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<1>"]
    build:
      command: "./build.sh"
      args: ["op=cmp", "width=${width}", "predicate=${predicate}", "latency=${latency}"]
      output_pattern: "FloatCmp_w${width}_p${predicate}_l${latency}.mlir"
      cache: true

  # ============================================================================
  # Integer/Float Conversion
  # ============================================================================

  - name: "Int2Float"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "Signed integer to IEEE 754 floating-point conversion using FloPoCo Fix2FP (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 2
        values: [1, 2, 3]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=i2f", "width=${width}", "latency=${latency}"]
      output_pattern: "Int2Float_w${width}_l${latency}.mlir"
      cache: true

  - name: "Float2Int"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "IEEE 754 floating-point to signed integer conversion using FloPoCo FP2Fix (II=1)"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        values: [16, 32]
        required: false
      - name: "latency"
        type: "integer"
        default: 2
        values: [1, 2]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<${width}>"]
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    build:
      command: "./build.sh"
      args: ["op=f2i", "width=${width}", "latency=${latency}"]
      output_pattern: "Float2Int_w${width}_l${latency}.mlir"
      cache: true

  # ============================================================================
  # Fixed-Point Trigonometric Functions
  # ============================================================================

  - name: "FixSinCos"
    type: "firrtl"
    path: "firrtl/flopoco_ip"
    description: "Fixed-point sin(π*x) and cos(π*x) for x in [-1,1) using FloPoCo FixSinCos (II=1)"
    parameters:
      - name: "precision"
        type: "integer"
        default: 24
        values: [11, 24]
        required: false
        description: "Fractional bits: 24 for single-precision, 11 for half-precision"
      - name: "latency"
        type: "integer"
        default: 3
        values: [2, 3, 4, 5]
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "compute"
        ready: true
        enable: true
        inputs: ["operand0: !firrtl.uint<25>"]
        outputs: ["sin_data: !firrtl.uint<25>", "cos_data: !firrtl.uint<25>"]
        # Note: Port width is precision+1 (25 for precision=24, 12 for precision=11)
    build:
      command: "./build.sh"
      args: ["op=sincos", "precision=${precision}", "latency=${latency}"]
      output_pattern: "FixSinCos_p${precision}_l${latency}.mlir"
      cache: true

  # ============================================================================
  # Synchronous FIFO (Arbitrary Width and Depth)
  # ============================================================================

  - name: "Fifo"
    type: "firrtl"
    path: "firrtl/fifo"
    description: "Synchronous FIFO with configurable width and depth"
    parameters:
      - name: "width"
        type: "integer"
        default: 8
        required: false
      - name: "depth"
        type: "integer"
        default: 16
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "write"
        ready: true
        enable: true
        inputs: ["wr_data: !firrtl.uint<${width}>"]
      - name: "read"
        ready: true
        enable: true
        outputs: ["rd_data: !firrtl.uint<${width}>"]
    conflict_matrix:
      - [write, write, "Conflict"]
      - [read, read, "Conflict"]
    build:
      command: "./build.sh"
      args: ["width=${width}", "depth=${depth}"]
      output_pattern: "Fifo_w${width}_d${depth}.mlir"
      cache: true
