version: "1.0"

modules:
  - name: "FIRRTLReg"
    type: "chisel"
    path: "chisel/reg"
    description: "Parametric register with configurable width"
    parameters:
      - name: "width"
        type: "integer"
        default: 32
        required: false
    ports:
      clock: "!firrtl.clock"
      reset: "!firrtl.uint<1>"
    methods:
      - name: "read"
        ready: true
        enable: false
        outputs: ["data: !firrtl.uint<${width}>"]
      - name: "write"
        ready: true
        enable: true
        inputs: ["data: !firrtl.uint<${width}>"]
    conflict_matrix:
      - [read, write, "SequentialBefore"]
    build:
      command: "./build.sh"
      args: []
      output_pattern: "Reg_width${width}.mlir"
      cache: true
